<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Feedback Form</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="card">
        <header class="form-header">
            <h1>Online Feedback Form</h1>
            <p class="subtitle">We value your opinion. Please share your feedback below.</p>
        </header>

        <form action="/submit" method="post" autocomplete="on">
            <div class="field">
                <label for="name">Name <span class="req">*</span></label>
                <input type="text" id="name" name="name" placeholder="Enter your full name"
                       required minlength="2" maxlength="60">
            </div>

            <div class="field">
                <label for="email">Email <span class="req">*</span></label>
                <input type="email" id="email" name="email" placeholder="you@example.com"
                       required maxlength="100">
            </div>

            <div class="field">
                <label for="category">Feedback Category <span class="req">*</span></label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>-- Select a category --</option>
                    <option value="Course Content">Course Content</option>
                    <option value="Teaching">Teaching</option>
                    <option value="Infrastructure">Infrastructure</option>
                    <option value="Website">Website</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <fieldset class="field">
                <legend>Rating <span class="req">*</span></legend>
                <div class="rating">
                    <!-- Listed 5 to 1 so the CSS star effect fills from the left -->
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5" title="5 - Excellent">&#9733;</label>
                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4" title="4 - Very Good">&#9733;</label>
                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3" title="3 - Good">&#9733;</label>
                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2" title="2 - Fair">&#9733;</label>
                    <input type="radio" id="star1" name="rating" value="1">
                    <label for="star1" title="1 - Poor">&#9733;</label>
                </div>
                <small class="hint">1 = Poor, 5 = Excellent</small>
            </fieldset>

            <div class="field">
                <label for="comments">Comments <span class="req">*</span></label>
                <textarea id="comments" name="comments" rows="5" placeholder="Write your feedback here..."
                          required minlength="5" maxlength="500"></textarea>
                <small class="hint">5 to 500 characters</small>
            </div>

            <button type="submit" class="btn">Submit Feedback</button>
        </form>
    </main>

    <footer>Online Feedback Form &middot; Java + Maven DevOps Practical</footer>
</body>
</html>
